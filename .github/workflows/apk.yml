name: Build SupremeFly Native
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04 # Ubuntu 22 é mais estável para Kivy/NDK 25b
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Hard Clean NDK
        run: |
          # Deleta qualquer rastro de NDKs pré-instalados que causam conflito
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/ndk-bundle
          # Limpa variáveis que o GitHub Actions força
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=" >> $GITHUB_ENV

      - name: Instalar Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Compilar APK
        run: |
          # Garante que o buildozer não veja os caminhos antigos
          export ANDROID_NDK_HOME=""
          export ANDROID_NDK_ROOT=""
          buildozer android debug
        env:
          ACCEPT_SDK_LICENSE: "y"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SupremeFly-Native-API
          path: bin/*.apk
