name: Build_Kivy_APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17 (Necessário para Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev liblzma-dev libffi-dev \
            libssl-dev unzip zip libncurses6 libncursesw6 libtinfo6 \
            cmake libtool autoconf automake pkg-config

      - name: Instalar Buildozer e Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy

      - name: Instalar SDK Android e AIDL
        run: |
          # Garante que o AIDL e as build-tools estejam presentes
          yes | sdkmanager --install "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Build APK com Buildozer
        run: |
          # Aceita licenças e inicia o build em modo detalhado
          yes | buildozer -v android debug
        continue-on-error: false

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: SupremeFly-Kivy-APK
          path: bin/*.apk
