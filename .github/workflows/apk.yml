name: Build_App
on:
  push:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preparar e Build
        run: |
          pip install flet
          # Força a criação dos arquivos de suporte do Android
          flet create . --template app --force
          # Roda o build de forma simplificada
          flet build apk

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: App-Supreme
          path: build/apk/*.apk
