name: Build SupremeFly Native
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Removendo Conflitos (NDK Fix)
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/ndk-bundle
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV

      - name: Instalar Ferramentas de Build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev wget curl libtool-bin zip unzip

      - name: Instalar Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Compilação Final
        run: |
          export ANDROID_NDK_HOME=""
          buildozer android debug
        env:
          ACCEPT_SDK_LICENSE: "y"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SupremeFly-V11-Stable
          path: bin/*.apk
