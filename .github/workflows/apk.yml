- name: Forçar Construção Limpa
        run: |
          pip install flet
          # Limpa qualquer rastro de builds que falharam
          rm -rf build
          # Cria o projeto do zero de forma silenciosa
          flet create . --template app --force
          # Tenta construir o APK ignorando avisos de versão
          flet build apk --verbose
