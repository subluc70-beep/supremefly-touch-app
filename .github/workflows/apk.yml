name: Build_App
on:
  push:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacao e Preparo
        run: |
          pip install flet
          flet create . --template app --force

      - name: Build do APK
        run: |
          # Aqui é a parte do RUN que você perguntou:
          flet build apk --project-name supremeapp --org com.supreme --verbose

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: App-Supreme
          path: build/apk/*.apk
