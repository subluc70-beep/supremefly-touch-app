name: Build_App
on:
  push:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet
        run: pip install flet

      - name: Build do APK
        run: |
          # Aceita licenças e constrói
          yes | flutter doctor --android-licenses
          flet build apk --verbose

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: App-Supreme
          path: build/apk/*.apk
