name: Build_App
on:
  push:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet e Dependencias
        run: |
          pip install flet
          # O Flet precisa dessa biblioteca no Linux para compilar
          sudo apt-get update
          sudo apt-get install -y setproctitle

      - name: Build do APK
        run: |
          # O comando 'yes' responde "sim" para todas as licenças do Android automaticamente
          # Isso evita o erro 100
          yes | flet build apk --verbose

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: App-Supreme-Touch
          path: build/apk/*.apk
