name: Build SupremeFly PRO
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt update
          sudo apt install -y python3-pip build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev
          sudo apt install -y libsqlite3-dev sqlite3 bzip2 libbz2-dev dirmngr libffi-dev libssl-dev
          pip3 install --user --upgrade Cython==0.29.33 virtualenv

      - name: Gerar APK com Buildozer
        run: |
          pip3 install --user buildozer
          export PATH=$PATH:$HOME/.local/bin
          # O comando abaixo limpa builds antigos e inicia um novo do zero
          buildozer android debug
        continue-on-error: false

      - name: Upload do APK Final
        uses: actions/upload-artifact@v4
        with:
          name: SupremeFly-PRO-APK
          path: bin/*.apk
          retention-days: 5
