name: Build_APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Dependencias do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev liblzma-dev libffi-dev libssl-dev unzip zip libncurses5 libncursesw5 libtinfo5 cmake libtool autoconf automake pkg-config

      - name: Configurar Python e Buildozer
        run: |
          pip install --upgrade pip
          pip install "cython<3.0" wheel setuptools buildozer

      - name: Build com Buildozer
        run: |
          # O 'yes |' aceita as licenças da Google automaticamente
          yes | buildozer -v android debug

      - name: Verificar se o APK foi criado
        run: ls -R bin/

      - name: Upload do APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: SupremeFly-PRO-V1.8
          path: bin/*.apk
          if-no-files-found: error
