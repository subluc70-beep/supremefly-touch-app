name: Build_App
on:
  push:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacao
        run: |
          pip install flet
          # Esse comando cria a estrutura se ela não existir
          flet create . --template app --force 

      - name: Build
        run: flet build apk --verbose

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: App-Instalador
          path: build/apk/*.apk
