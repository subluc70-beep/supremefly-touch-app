name: Build SupremeFly PRO
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev libffi-dev libssl-dev
          pip install --upgrade pip
          pip install "Cython<3.0" virtualenv buildozer

      - name: Build with Buildozer
        run: |
          buildozer android debug
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SupremeFly-PRO-Package
          path: bin/*.apk
