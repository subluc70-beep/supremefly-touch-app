name: Build SupremeFly PRO
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Deps
        run: |
          sudo apt update
          sudo apt install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dist libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev libsqlite3-dev libffi-dev libssl-dev
          pip install --upgrade pip
          pip install "Cython<3.0" virtualenv buildozer
      - name: Build
        run: |
          buildozer android clean
          buildozer android debug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SupremeFly-APK
          path: bin/*.apk
