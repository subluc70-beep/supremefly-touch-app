name: Build_App
on:
  push:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ESTE PASSO RESOLVE O ERRO 100
      - name: Instalar Flet e Dependências
        run: |
          pip install flet
          sudo apt-get update
          sudo apt-get install -y setproctitle

      - name: Build do APK
        run: |
          # O comando 'yes' aceita as licenças do Android automaticamente
          yes | flet build apk --verbose

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: App-Supreme
          path: build/apk/*.apk
