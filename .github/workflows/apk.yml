name: Build_App
on:
  push:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        run: |
          pip install flet
          # Forçamos o Flet a reconhecer a pasta atual como um projeto
          flet create . --template app --force
          # Executamos o build garantindo o nome do projeto
          flet build apk --project-name "supremeapp" --org "com.supreme"

      - name: Enviar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: App-Instalador
          path: build/apk/*.apk
