name: Build SupremeFly APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev wget curl libncursesw5-dev libtool-bin openjdk-17-jdk zip unzip

      - name: Instalar Buildozer e Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Build do APK (Correção de Caminho)
        run: |
          # Primeiro inicializamos o buildozer sem rodar o build completo para ele criar as pastas
          buildozer init
          # Agora rodamos o build direto. O GitHub Actions já é um ambiente limpo, 
          # então não precisamos do 'clean' que estava causando o erro de FileNotFoundError.
          buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: "y"

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: SupremeFly-Android11-Plus
          path: bin/*.apk
          retention-days: 5
