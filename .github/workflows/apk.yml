name: Build_Kivy_APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências (Sem Erro 100)
        run: |
          sudo apt-get update
          # O DEBIAN_FRONTEND=noninteractive evita que o sistema faça perguntas e trave
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good libsqlite3-dev \
            sqlite3 bzip2 libbz2-dev liblzma-dev libffi-dev libssl-dev unzip zip \
            libncurses5 libncursesw5 libtinfo5 cmake libtool autoconf automake pkg-config

      - name: Instalar Buildozer e Cython
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython<3.0" kivy

      - name: Build APK
        run: |
          # Criar pasta de configurações para evitar erro de permissão
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # Limpar e construir
          buildozer android clean
          yes | buildozer -v android debug
        continue-on-error: false

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: SupremeFly-Kivy-APK
          path: bin/*.apk
