name: Gerar APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet
        run: pip install flet

      - name: Preparar e Construir APK
        run: |
          flet create . --template brief-app
          flet build apk --verbose

      - name: Enviar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: App-Supreme
          path: build/apk/*.apk
