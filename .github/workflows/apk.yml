name: Build_SupremeFly
on: [push, workflow_dispatch]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer
        run: |
          pip install --user --upgrade Cython==0.29.33 buildozer
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev libsqlite3-dev libffi-dev libssl-dev python3-setuptools

      - name: Build APK
        run: |
          # Força o caminho do buildozer para o sistema não se perder
          export PATH=$PATH:$HOME/.local/bin
          buildozer android debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SupremeFly-APK
          path: bin/*.apk
