name: Build_App
on:
  push:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java (Necessario para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet e Preparar
        run: |
          pip install flet
          flet create . --template app --force

      - name: Build do APK
        run: |
          # Adicionamos o nome do projeto e da organizacao para evitar erro de identidade
          flet build apk --project-name supremeapp --org com.supreme

      - name: Upload do Resultado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: App-Supreme-Final
          path: build/apk/*.apk
