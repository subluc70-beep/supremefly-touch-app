name: Build SupremeFly
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04 # Mudamos para 22.04 para maior estabilidade com Python 3.10
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Limpeza de Conflitos NDK
        run: |
          # Remove NDKs pré-instalados que causam erro de conflito
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          # Limpa variáveis que apontam para caminhos errados
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=" >> $GITHUB_ENV
          rm -rf .buildozer/

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev wget curl libncursesw5-dev libtool-bin openjdk-17-jdk zip unzip

      - name: Instalar Buildozer e Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Gerar APK Final
        run: buildozer android debug
        env:
          ACCEPT_SDK_LICENSE: "y"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SupremeFly-Touch-Final
          path: bin/*.apk
