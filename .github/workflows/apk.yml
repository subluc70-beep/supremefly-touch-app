name: Build_APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev liblzma-dev libffi-dev libssl-dev unzip zip libncurses5 libncursesw5 libtinfo5 cmake libtool autoconf automake pkg-config

      - name: Configurar Python
        run: |
          pip install --upgrade pip
          pip install "cython<3.0" wheel setuptools buildozer

      - name: Build Final
        run: |
          buildozer android clean
          yes | buildozer -v android debug
